<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H4KKEN — Debug</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: -apple-system, system-ui, sans-serif; color: #eee; }
    #canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
    #panel {
      position: absolute; top: 8px; right: 8px;
      background: rgba(0,0,0,0.85);
      padding: 12px 14px; border-radius: 6px;
      font-size: 12px; min-width: 280px; max-height: calc(100vh - 24px);
      overflow-y: auto; z-index: 10; backdrop-filter: blur(4px);
    }
    #panel .row {
      display: grid; grid-template-columns: 1fr auto; gap: 6px;
      align-items: center; margin: 3px 0; font-family: monospace;
    }
    #panel .row label { display: block; font-size: 10px; color: #ccc; }
    #panel .row input[type="range"] { width: 100%; }
    #panel .row .val { font-size: 10px; color: #8cf; min-width: 44px; text-align: right; }
    #panel .empty { color: #666; font-size: 10px; font-style: italic; padding: 4px 0; }
    #panel h3 { margin: 8px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #888; }
    #panel h3:first-child { margin-top: 0; }
    #panel select, #panel button {
      width: 100%; padding: 6px 8px; margin: 2px 0;
      background: #2a2a2a; color: #eee; border: 1px solid #444;
      border-radius: 3px; font-size: 12px; box-sizing: border-box;
    }
    #panel select:hover, #panel button:hover { background: #333; border-color: #555; }
    #panel label {
      display: flex; align-items: center; gap: 6px;
      margin: 4px 0; cursor: pointer; user-select: none;
    }
    #panel input[type="checkbox"] { margin: 0; cursor: pointer; }
    #panel .help { font-size: 10px; color: #888; margin-top: 10px; line-height: 1.4; }
    #status {
      position: absolute; bottom: 8px; left: 8px;
      background: rgba(0,0,0,0.75); padding: 6px 10px; border-radius: 4px;
      font-size: 11px; color: #aaa; font-family: monospace;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="panel">
    <h3>Character</h3>
    <select id="char-select"></select>
    <h3>Animation</h3>
    <select id="anim-select"></select>
    <h3>View</h3>
    <label><input type="checkbox" id="show-debug"> Show jiggle bones + colliders</label>
    <label><input type="checkbox" id="paused"> Pause animation</label>
    <div class="row">
      <label>Speed</label>
      <span class="val" id="speed-val">1.00×</span>
    </div>
    <div style="grid-column: 1 / -1;">
      <input type="range" id="speed" min="0.05" max="2" step="0.05" value="1" style="width: 100%;">
    </div>
    <button id="reset-cam">Reset Camera</button>
    <h3>Physics features <span style="color:#888;font-size:10px;font-weight:normal">(toggle to isolate)</span></h3>
    <label><input type="checkbox" id="t-colliders" checked> Capsule colliders</label>
    <label><input type="checkbox" id="t-plates" checked> Plate colliders</label>
    <label><input type="checkbox" id="t-lateral" checked> Lateral spring pairs</label>
    <label><input type="checkbox" id="t-sticky" checked> Sticky binding</label>
    <label><input type="checkbox" id="t-damping" checked> Collision damping</label>
    <label><input type="checkbox" id="t-pendulum"> Lock cloth chains to character YZ plane (pendulum only — no sideways)</label>
    <div class="row">
      <label>Stick strength</label>
      <span class="val" id="stick-val">0.60</span>
    </div>
    <div style="grid-column: 1 / -1;">
      <input type="range" id="stick" min="0" max="1" step="0.05" value="0.6" style="width: 100%;">
    </div>
    <h3>Live stats</h3>
    <pre id="live-stats" style="font-size:10px;color:#8cf;font-family:monospace;margin:0;line-height:1.4;background:#111;padding:6px;border-radius:3px;"></pre>
    <h3>Colliders <span id="colliders-count" style="color:#888;font-size:10px;font-weight:normal"></span></h3>
    <div id="colliders-list"></div>
    <h3>Plates <span id="plates-count" style="color:#888;font-size:10px;font-weight:normal"></span></h3>
    <div id="plates-list"></div>
    <h3>Lateral pairs <span id="pairs-count" style="color:#888;font-size:10px;font-weight:normal"></span></h3>
    <div id="pairs-list"></div>
    <button id="copy-config" style="margin-top:8px">Copy tuned values to clipboard</button>
    <p class="help">
      Left-drag: orbit · Right-drag: pan · Wheel: zoom
    </p>
  </div>
  <div id="status">loading...</div>
  <script type="module" src="/src/debug-page.ts"></script>
</body>
</html>
